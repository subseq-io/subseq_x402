[package]
name = "subseq_x402"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8", optional = true, features = ["macros", "http2"] }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4.43", features = ["serde"] }
http = { version = "1", optional = true }
once_cell = "1.21.3"
reqwest = { version = "0.12", optional = true, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", optional = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono", "json"] }
subseq_agents = { optional = true, git = "https://github.com/subseq-io/subseq_agents.git", branch = "main" }
subseq_auth = { optional = true, git = "https://github.com/subseq-io/subseq_auth.git", branch = "main" }
tokio = { version = "1.47", optional = true, features = ["macros", "rt-multi-thread", "sync", "net"] }
tower = { version = "0.5", optional = true }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
x402-axum = { version = "1.3.0", optional = true }
x402-types = { version = "1.3.0", optional = true }

[features]
default = ["api"]
api = [
  "dep:axum",
  "dep:base64",
  "dep:http",
  "dep:reqwest",
  "dep:subseq_agents",
  "dep:subseq_auth",
  "dep:tokio",
  "dep:tower",
  "dep:x402-axum",
  "dep:x402-types",
  "sqlx",
]
sqlx = ["dep:sqlx"]

[dev-dependencies]
axum = { version = "0.8", features = ["macros", "http2"] }
http = "1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "net"] }
wiremock = "0.6"
